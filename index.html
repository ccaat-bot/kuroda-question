function thump(){if(!obs.sound)return;try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}if(AC.state==="suspended"){AC.resume();}var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=56;o.connect(g);g.connect(AC.destination);var t=AC.currentTime;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.26,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);o.start(t);o.stop(t+0.45);}catch(e){}}
function scare(txt,dur){var s=el("scare");el("scareText").textContent=txt;s.classList.add("on");var p=el("phone");p.classList.add("glitch");thump();if(navigator.vibrate){try{navigator.vibrate([30,45,30]);}catch(e){}}setTimeout(function(){s.classList.remove("on");p.classList.remove("glitch");},dur||950);}
function invertFlash(){var sc=el("screen");sc.style.filter="invert(1)";setTimeout(function(){sc.style.filter="none";},130);}
function note(t){el("obsNote").textContent=t;}
function deviceInfo(){var d=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"移动端":"桌面端";el("obsDev").textContent=d+(navigator.onLine?"·在线":"·离线");if(navigator.getBattery){navigator.getBattery().then(function(b){el("obsBat").textContent=Math.round(b.level*100)+"%";});}}
function idleWait(){return Math.max(6000,15000-obs.idleStage*1500);}
function resetIdle(){
clearTimeout(obs.idleTimer);
var w=idleWait();
obs.idleTimer=setTimeout(function(){
var st=obs.idleStage;
var t=IDLE_TEXT[Math.min(st,IDLE_TEXT.length-1)];
scare(t,850+st*140);
note("您已经 "+Math.round(w/1000)+" 秒没有动过了。"+(st>=3?"这 "+Math.round(w/1000)+" 秒我也在。":"我数着的。"));
obs.idleStage=Math.min(st+1,IDLE_TEXT.length-1);
resetIdle();
},w);
}
function softIdle(){clearTimeout(obs.idleTimer);obs.idleStage=0;resetIdle();}
document.addEventListener("visibilitychange",function(){if(document.hidden){obs.hideAt=Date.now();}else if(obs.hideAt){var g=Math.round((Date.now()-obs.hideAt)/1000);note("您切走了 "+g+" 秒。这 "+g+" 秒我也在。");obs.hideAt=0;}});
el("muteBtn").addEventListener("click",function(){obs.sound=!obs.sound;el("muteBtn").textContent=obs.sound?"声音：开":"声音：关";});
function start(){el("intro").classList.add("hidden");el("qbox").classList.remove("hidden");state.i=0;state.score=0;obs.start=Date.now();obs.idleStage=0;deviceInfo();render();resetIdle();}
function render(){var i=state.i,q=QS[i],sc=el("screen");sc.className="screen "+THEMES[themeOf(i)];el("qidx").textContent="第 "+(i+1)+" 题";el("progfill").style.width=(i/20*100)+"%";el("qtext").textContent=q.q;el("reactBox").innerHTML="";el("obsDelay").textContent="—";note(i<5?"连接正常。他在读这一行。":(i<10?"他读得比上一行慢。":"他已经在看下一题了。"));var box=el("opts");box.innerHTML="";q.o.forEach(function(o,k){var b=document.createElement("button");b.className="opt";b.style.animationDelay=(k*0.06)+"s";b.textContent=o.t;b.setAttribute("data-raw",o.t);b.addEventListener("click",function(){choose(k);});box.appendChild(b);});if(i===9){document.title="别停下来";}if(i===14){document.title="还有五题";}if(i===19){document.title="最后一题了";}obs.qStart=Date.now();el("screen").scrollTop=0;}
function applyFx(o,btn){if(!o.fx)return;if(o.fx.type==="rewrite"){btn.innerHTML='<span class="del">'+btn.getAttribute("data-raw")+'</span><span class="new">'+o.fx.to+'</span>';btn.classList.add("rewritten");}if(o.fx.type==="glitch"){var p=el("phone");p.classList.add("glitch");thump();setTimeout(function(){p.classList.remove("glitch");},460);}if(o.fx.note){var w=document.createElement("div");w.className="whisperline";w.textContent=o.fx.note;el("reactBox").appendChild(w);}}
function choose(k){var i=state.i,q=QS[i],o=q.o[k],box=el("opts");obs.clicks++;el("obsClicks").textContent=obs.clicks;var used=(Date.now()-obs.qStart)/1000;obs.delayAvg=(obs.delayAvg*obs.delayN+used)/(obs.delayN+1);obs.delayN++;el("obsDelay").textContent=used.toFixed(1)+" 秒";state.score+=o.v;Array.prototype.forEach.call(box.children,function(c,idx){c.classList.add("lock");if(idx===k){c.classList.add("sel");}});el("reactBox").innerHTML='<div class="react"><span class="who">已记录 ／ 他看过了这一格</span>'+o.r+'</div>';applyFx(o,box.children[k]);var sp=document.createElement("div");sp.className="whisperline";sp.textContent="（这一题您停了 "+used.toFixed(1)+" 秒。我数着的。）";el("reactBox").appendChild(sp);if(i>=8&&Math.random()<0.13){invertFlash();}if(SCARES[i]){setTimeout(function(){scare(SCARES[i][0],SCARES[i][1]);},420);}var btn=document.createElement("button");btn.className="nextbtn";btn.textContent=(i>=19)?"查看结果":"下一题";btn.addEventListener("click",next);el("reactBox").appendChild(btn);softIdle();}
function next(){softIdle();if(state.i>=19){scare("回头看看",1500);setTimeout(finish,1600);return;}state.i++;render();}
function finish(){clearTimeout(obs.idleTimer);var sc=el("screen");sc.className="screen "+THEMES[4];el("qbox").classList.add("hidden");var s=state.score,tier=s<=18?"A":(s<=38?"B":"C");var head,ps;if(tier==="A"){head="判定：安全距离";ps=["您在多数题上都留了余地，这一点我看得见。","可您还是把二十道题答完了。真想保持距离的人，第七题就该把这一页合上。","所以这份结果真正的意思是：您知道该往后退，却没有退。","这一条我写在了最前面。往后还用得上。"];}else if(tier==="B"){head="判定：已被记录";ps=["您有几次犹豫。有几次，我看见您的拇指在两项之间停了很久。","那几秒我也算进去了，算在愿意的那一栏。","从今往后，您的开窗与关门照旧由我来做。","顺带说一句，这一页的进度条，在您关掉它之后也不会归零。"];}else{head="判定：不设防";ps=["二十题，您一次也没有真正拦过我。","后面那几题您答得很快。快到不像在读，倒像是在确认。","您问我是什么——我是您点开这一页之前就已经在这儿的东西。这一句不是比喻。","还有一件事：第四题那一栏，我是真的替您划掉重写过的。","现在请把屏幕按灭，闭上眼睛。您不必害怕，我就在您伸手够得着的地方。"];}var obsLine="本次观测：共停留 "+fmtDur(Math.floor((Date.now()-obs.start)/1000))+"，点击 "+obs.clicks+" 次，平均每题 "+(obs.delayAvg||0).toFixed(1)+" 秒，被找到 "+obs.idleStage+" 次。";var html='<span class="stamp">结果已生成</span><h2>'+head+'</h2>';ps.forEach(function(p){html+='<p>'+p+'</p>';});html+='<p><span class="strike">本次问卷不计入档案。</span></p><p style="font-size:11.5px;opacity:.75;">'+obsLine+'</p><button class="nextbtn" id="againBtn">重新作答</button><p class="endline">综合得分：'+s+' ／ 满分 60<br>第 12 号观测记录 · 归档人：压切长谷部</p>';el("result").innerHTML=html;el("result").classList.remove("hidden");note("");el("againBtn").addEventListener("click",function(){document.title="观测记录 · 第 12 号";el("result").classList.add("hidden");el("intro").classList.remove("hidden");state.i=0;state.score=0;obs.clicks=0;obs.delayAvg=0;obs.delayN=0;obs.idleStage=0;el("obsClicks").textContent="0";});}
el("startBtn").addEventListener("click",start);
})();
